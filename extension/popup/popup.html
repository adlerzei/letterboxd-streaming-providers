<!DOCTYPE html>

<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css"/>
</head>

<body>

<div class="title">
  <img src="../icons/logo_final_32.png" alt="Letterboxd Streaming Providers" height="32" width="32" class="title-img">
  <div class="title-text">
    Letterboxd Streaming Providers
  </div>
</div>

<section id="content">
  <label class="switch">
    <span class="slider-text">Filter entries</span>
    <input type="checkbox" id="filterSwitch">
    <span class="slider"></span>
  </label>

  <div class="select-box">
    <label class="content-text" for="CountryList">Country</label>
    <select id="CountryList"></select>
  </div>

  <div class="select-box" id="ProviderBox">
    <div class="label-row">
      <span class="content-text" id="ProviderLabel">Streaming service</span>
      <span class="selection-meta"><span id="SelectionCount">0 selected</span> · <button type="button" class="link-button" id="ClearSelection">Clear</button></span>
    </div>
    <input type="search" class="provider-search" id="ProviderSearch" placeholder="Search services…" aria-label="Search streaming services" autocomplete="off">
    <div class="provider-list" id="ProviderList" role="listbox" aria-multiselectable="true" aria-labelledby="ProviderLabel"></div>
  </div>
</section>

<section class="footer">
  <div class="footer-text">Streaming information provided by</div>
  <div class="justwatch-logo">
    <a href="https://justwatch.com" title="JustWatch" target="_blank" rel="noopener"><img src="../justwatch/logo.png" alt="JustWatch"></a>
  </div>
</section>

<section class="footer">
  <div class="footer-text">Further information? Contributing? Go <a href="https://github.com/adlerzei/letterboxd-streaming-providers#readme" title="Letterboxd Streaming Providers on GitHub" target="_blank" rel="noopener">here</a>!</div>
</section>

<script src="popup.js"></script>
</body>

</html>
